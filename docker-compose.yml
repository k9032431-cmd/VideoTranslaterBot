services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
      # Local Bot API server stores downloaded files here; the bot reads them by the same path.
      - telegram-bot-api-data:/var/lib/telegram-bot-api

  # Optional: lifts Telegram's 20 MB / 50 MB bot limits to 2 GB.
  # Start with: docker compose --profile bigfiles up -d
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    profiles: [bigfiles]
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api

volumes:
  telegram-bot-api-data:
